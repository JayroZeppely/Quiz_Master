
<div>
  <h2>Question {{ id }}</h2>
  <fieldset>
    <legend>{{ question }}</legend>
    @for (option of options; track $index) {
      <div class="option">
        <input
          type="radio"
          name="question-{{ id }}"
          id="question-{{ id }}-option-{{ $index }}"
          [checked]="selectedOption === $index"
          (change)="selectOption(id - 1, $index)"
        >
        <label for="question-{{ id }}-option-{{ $index }}">{{ option }}</label>
      </div>
    }
  </fieldset>
</div>
<div>
  @if (isLastQuestion) {
    <button type="button" id="btn_finish" [disabled]="isNextDisabled" (click)="finishQuizInput()">Terminer le Quiz</button>
  } @else {
    <button type="button" id="btn_next" [disabled]="isNextDisabled" (click)="goToNextQuestion()">Suivant</button>
  }
</div>
